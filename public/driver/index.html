<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MovixFrota | Portal do Motorista</title>
    <!-- Metas SEO & UX -->
    <meta name="description" content="Portal do Motorista MovixFrota - Controle rápido de viagens, abastecimentos e ocorrências pelo celular.">
    <meta name="theme-color" content="#0a0a0c">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Estilos -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/autocomplete.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">

    <!-- Container Centralizador -->
    <div id="driver-app" class="driver-container">
        <!-- Renderizado dinamicamente pelo driver.js -->
        <div id="app-loading" class="loading-state">
            <div class="spinner"></div>
            <p>Carregando Portal...</p>
        </div>
    </div>

    <!-- Toast de Notificação -->
    <div id="driver-toast" class="toast"></div>

    <!-- Script de Controle -->
    <script src="driver.js"></script>
</body>
</html>
